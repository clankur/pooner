# Quick sim iteration with Qwen3.5-4B (fewer steps/smaller groups)
# uv run python -m train --config-name=gpu_4090_quick ++paths.model_name=quick_001
defaults:
  - sim_base
  - _self_

model:
  model_name_or_path: "Qwen/Qwen3.5-4B"
  quantize_int4: false

grpo:
  group_size: 4
  learning_rate: 3.e-5
  max_steps: 100
  log_interval: 1
  checkpoint_interval: 25
  kl_coeff: 0.0
