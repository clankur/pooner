# RUNQ_EXPERIMENT_ID=local uv run python -m train --config-name=local_test ++paths.model_name=smoke_000
defaults:
  - base
  - _self_

model:
  model_name_or_path: "Qwen/Qwen3.5-0.8B-Base"
  quantize_int4: false
  max_new_tokens: 128
  temperature: 0.8

grpo:
  group_size: 4
  max_steps: 10
  log_interval: 1
  checkpoint_interval: 5
  seed: 0
  update_epochs: 1

env:
  max_actions: 5
  use_heuristic_reward: true
