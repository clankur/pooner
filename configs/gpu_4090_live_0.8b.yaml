# Experiment 2: Live game training with Qwen3.5-0.8B on 4090
# 0.8B in bf16 is ~1.6GB — no quantization needed, leaves headroom for larger groups
# uv run python -m train --config-name=gpu_4090_live_0.8b ++paths.model_name=exp2_0.8b_001
defaults:
  - live_base
  - _self_

model:
  model_name_or_path: "Qwen/Qwen3.5-0.8B"
  quantize_int4: false

grpo:
  group_size: 8
  lr_max: 3.e-5
  lr_min: 3.e-6
  warmup_steps: 15
  kl_coeff: 0.01
  max_steps: 500
