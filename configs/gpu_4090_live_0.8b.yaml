# Live game training with Qwen3.5-0.8B
# Requires LostCity server + gateway running
# uv run python -m train --config-name=gpu_4090_live_0.8b ++paths.model_name=live_0.8b_001
defaults:
  - base
  - _self_

model:
  model_name_or_path: "Qwen/Qwen3.5-0.8B"
  quantize_int4: false
  max_new_tokens: 4096
  temperature: 0.7

grpo:
  group_size: 4
  learning_rate: 3.e-5
  max_steps: 100
  log_interval: 1
  checkpoint_interval: 25
  kl_coeff: 0.0

env:
  max_actions: 10
  use_heuristic_reward: false
