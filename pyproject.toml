[project]
name = "pooner"
version = "0.1.0"
description = "GRPO-trained LLM agent for RuneScape planning (LostCity/2004scape)"
requires-python = ">=3.11"

dependencies = [
    "transformers>=4.40",
    "torchao>=0.5",
    "accelerate>=0.30",
    "hydra-core>=1.3",
    "einops",
    "pydantic>=2.0",
    "wandb",
    "runq",
]

[project.optional-dependencies]
cpu = ["torch"]
gpu = ["torch", "flash-attn>=2.7"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
runq = { git = "ssh://git@github.com/clankur/runq.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
